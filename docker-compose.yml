version: "3.9"

services:
  bi-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bi-assistant
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
    volumes:
      - ./assets:/app/assets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
